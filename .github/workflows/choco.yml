# Every hour: when GitHub has a release newer than choco/xtermium, points the package at its MSI
# (the sha256 is the digest GitHub computed on upload), packs it, pushes it to the Chocolatey
# Community Repository, and commits the change here. A failed push commits nothing, so the next
# run tries again. Needs one secret, CHOCO_API_KEY (community.chocolatey.org > Account > API Keys).
# Releases only: see PUBLISHING.md for why nightly builds don't go to the community repository.
#
# Until one version of the package has been approved, Chocolatey refuses every newer version with
# a 403 (a new package's first version is reviewed by a person first). The public feed lists
# approved versions only, so while it has none this waits, and says so, instead of failing every
# hour. When a moderator asks for a change to the version in moderation, fix choco/xtermium and
# run this by hand with "resubmit": the same version is packed and pushed again, as they ask.
name: choco

on:
  workflow_dispatch:
    inputs:
      resubmit:
        description: Push the version in choco/xtermium again, as it is (a moderator asked for a change)
        type: boolean
        default: false
  schedule:
    - cron: '50 * * * *'

concurrency:
  group: choco
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.c.outputs.version }}
      sha: ${{ steps.c.outputs.sha }}
      resubmit: ${{ steps.c.outputs.resubmit }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUBMIT: ${{ inputs.resubmit }}
        run: |
          have=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' choco/xtermium/xtermium.nuspec)
          if [ "$RESUBMIT" = true ]; then
            echo "resubmitting $have as it is in choco/xtermium"
            echo "resubmit=$have" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rel=$(gh api repos/xtermium/xtermium/releases/latest)
          v=$(jq -r .tag_name <<<"$rel"); v=${v#v}
          sha=$(jq -r --arg n "xtermium_${v}_x64_en-US.msi" '.assets[] | select(.name == $n) | .digest // empty' <<<"$rel" | sed -n 's/^sha256://p')
          # Approved versions, as the public feed lists them (one in moderation isn't there).
          feed=$(curl -fsS "https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'xtermium'")
          approved=$(grep -c '<entry>' <<<"$feed" || true)
          if [ "$v" = "$have" ]; then echo "$v is pushed already"
          elif [ -z "$sha" ]; then echo "$v has no MSI yet"
          elif [ "$approved" = 0 ]; then
            echo "::notice::$v waits: $have is still in moderation and Chocolatey takes no newer version until one is approved (https://community.chocolatey.org/packages/xtermium)"
          else echo "version=$v" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; fi

  push:
    needs: check
    if: needs.check.outputs.version != '' || needs.check.outputs.resubmit != ''
    runs-on: windows-latest
    env:
      V: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      AGAIN: ${{ needs.check.outputs.resubmit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The same version again, unchanged here: nothing to commit.
      - if: env.AGAIN != ''
        run: |
          cd choco/xtermium
          choco pack
          choco push "xtermium.$AGAIN.nupkg" --source https://push.chocolatey.org/ --api-key "${{ secrets.CHOCO_API_KEY }}"
      - if: env.AGAIN == ''
        run: |
          cd choco/xtermium
          old=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' xtermium.nuspec)
          sed -i "s/$old/$V/g" xtermium.nuspec tools/chocolateyInstall.ps1
          sed -i "s/checksum64     = '.*'/checksum64     = '$SHA'/" tools/chocolateyInstall.ps1
          choco pack
          choco push "xtermium.$V.nupkg" --source https://push.chocolatey.org/ --api-key "${{ secrets.CHOCO_API_KEY }}"
          rm "xtermium.$V.nupkg"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "choco xtermium $V" && git push
